spring.config.import=optional:file:.env[.properties]
server.port=8081
spring.datasource.url=${DATABASE_URL:jdbc:sqlite:./db.sqlite3}
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.sql.init.mode=never
spring.web.resources.static-locations=classpath:/static/,file:./static/

spring.mail.host=${EMAIL_HOST:smtp.gmail.com}
spring.mail.port=${EMAIL_PORT:587}
spring.mail.username=${EMAIL_HOST_USER:}
spring.mail.password=${EMAIL_HOST_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=${EMAIL_USE_TLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

logging.level.com.greencrate=INFO
